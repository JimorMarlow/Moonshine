; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
framework = arduino
monitor_speed = 115200
extra_scripts = pre:sync_version.py
lib_deps =
	gyverlibs/GyverDS18@^1.2.0
	gyverlibs/GTimer@^1.1.1
	gyverlibs/FileData@^1.0.3
    gyverlibs/GyverIO@^1.4.2	
    gyverlibs/EncButton@^3.7.6	
	gyverlibs/GyverLCD@^1.0.5	
	bblanchon/ArduinoJson@^7.0.0
    knolleary/PubSubClient@^2.8
    https://github.com/JimorMarlow/ETL@^1.1.2    
    ; Для локальной отладки раскомментируйте путь к локальной копии
    ; ../ETL

[env:nodemcuv3]
platform = espressif8266
board = nodemcuv2
board_build.filesystem = littlefs
build_flags = 
	-D BOARD_NODEMCU
	${env.build_flags}
	-D PIO_FRAMEWORK_ARDUINO_ENABLE_MD5

[env:esp32-wroom-38u]
platform = espressif32
board = esp32dev
board_build.filesystem = littlefs
;board_build.partitions = littlefs/esp32wroom32u_spiffs.csv
upload_speed = 921600
lib_ldf_mode = chain
build_flags = 
    ${env.build_flags}
    -std=gnu++17
    -D CONFIG_SPIRAM_IGNORE_NOTFOUND
    -D BOARD_ESP32_WROOM_38U
;   -D ESP32
build_unflags = 
    -std=gnu++11
    -Wregister
platform_packages = 
    platformio/tool-mkspiffs@^1
