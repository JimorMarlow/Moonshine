<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Moonshine - Monitoring</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 2px;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Горизонтальный макет (по умолчанию) */
        .main-panel {
            display: grid;
            grid-template-columns: 1fr minmax(250px, 1fr);
            gap: 5px;
            height: calc(100vh - 4px);
        }

        .scheme-container {
            background: #ffffff;
            border-radius: 8px;
            padding: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border: 1px solid #e0e0e0;
            position: relative;
            overflow: hidden;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .sensors-panel {
            background: #ffffff;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border: 1px solid #e0e0e0;
            min-width: 250px;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sensors-content {
            flex: 1;
            overflow-y: auto;
        }

        .distillation-svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Components - Minimalist style */
        .heater {
            fill: #ffffff;
            stroke-width: 2.5;
        }

        .heater-liquid {
            fill: #3498db;
            opacity: 0.3;
        }

        /* Column: No border, just gradient */
        .column {
            stroke: none;
        }

        .deflegmator {
            fill: #ffffff;
            stroke: #27ae60;
            stroke-width: 2.5;
        }

        .condenser {
            fill: #ffffff;
            stroke: #3498db;
            stroke-width: 2.5;
        }

        .pipe {
            fill: none;
            stroke: #95a5a6;
            stroke-width: 4;
            stroke-linecap: round;
        }

        /* Vapor Pipe: Thicker (12px), rounded joins */
        .vapor-pipe {
            stroke-width: 12;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .water-pipe-in {
            stroke: #3498db;
            stroke-width: 4;
        }

        .water-pipe-out {
            stroke-width: 4;
        }

        .product-pipe {
            stroke: #95a5a6; /* Gray */
            stroke-width: 5;
        }

        /* Temperature display rectangles */
        .temp-rect {
            fill: #ffffff;
            stroke: #f39c12;
            stroke-width: 1;
        }

        /* Flow value display rectangles */
        .flow-value-rect {
            fill: #ffffff;
            stroke: #1abc9c;
            stroke-width: 1;
        }

        /* Combined temperature text style */
        .temp-text, .flow-text {
            font-size: 24px;
            font-weight: 300;
            fill: #2c3e50;
            text-anchor: middle;
            font-family: 'Courier New', monospace;
            dominant-baseline: middle;
        }

        .flow-unit-text {
            font-size: 12px;
            font-weight: 500;
            fill: #7f8c8d;
            text-anchor: middle;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            dominant-baseline: middle;
        }

        .temp-label {
            font-size: 14px;
            fill: #7f8c8d;
            text-anchor: middle;
            font-weight: 500;
        }

        /* Flow sensors with rotating wheels */
        .sensor-flow-rect {
            fill: #1abc9c;
            stroke: #16a085;
            stroke-width: 2;
            cursor: pointer;
        }

        .flow-wheel-group {
            transform-box: fill-box;
            transform-origin: center;
        }

        .flow-wheel-slow {
            animation: rotate 3s linear infinite;
        }

        .flow-wheel-medium {
            animation: rotate 1.5s linear infinite;
        }

        .flow-wheel-fast {
            animation: rotate 0.7s linear infinite;
        }

        .flow-wheel {
            fill: none;
            stroke: #ffffff;
            stroke-width: 2;
        }

        .flow-wheel-line {
            stroke: #ffffff;
            stroke-width: 2;
            stroke-linecap: round;
        }

        /* Warning Icon */
        .warning-icon {
            display: none;
        }

        .warning-icon path {
            fill: #f1c40f;
            stroke: #d35400;
            stroke-width: 1;
        }

        .warning-icon text, .warning-icon circle {
            fill: #2c3e50;
            font-weight: 900;
            font-family: sans-serif;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Flow animation */
        .flow-slow {
            stroke-dasharray: 10, 10;
            animation: flowAnimation 2s linear infinite;
        }

        .flow-medium {
            stroke-dasharray: 8, 8;
            animation: flowAnimation 1s linear infinite;
        }

        .flow-fast {
            stroke-dasharray: 5, 5;
            animation: flowAnimation 0.5s linear infinite;
        }

        @keyframes flowAnimation {
            to {
                stroke-dashoffset = -20;
            }
        }

        /* Drop Animation */
        .drop-blink-1hz {
            animation: blink 1s infinite;
        }
        .drop-blink-2hz {
            animation: blink 0.5s infinite;
        }
        .drop-blink-4hz {
            animation: blink 0.25s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        /* Bubble Animation */
        .bubble {
            fill: #3498db;
            opacity: 0.6;
            transform-box: fill-box;
            transform-origin: center bottom;
            animation: rise linear infinite;
        }

        /* Bubble Speed Gradations */
        .bubble-speed-1 { animation-duration: 5s; } /* 60-65 */
        .bubble-speed-2 { animation-duration: 4s; } /* 65-70 */
        .bubble-speed-3 { animation-duration: 3s; } /* 70-75 */
        .bubble-speed-4 { animation-duration: 2s; } /* 75-80 */
        .bubble-speed-5 { animation-duration: 1.5s; } /* 80-85 */
        .bubble-speed-6 { animation-duration: 1s; } /* 85-90 */
        .bubble-speed-7 { animation-duration: 0.5s; } /* >90 */

        @keyframes rise {
            0% {
                transform: translateY(0) scale(0.5);
                opacity: 0;
            }
            20% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-60px) scale(1.2);
                opacity: 0;
            }
        }

        /* Sensor Cards - Minimalist */
        .sensor-card {
            background: #fafafa;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 10px;
            border-left: 4px solid;
            transition: all 0.3s;
        }

        .sensor-card:hover {
            background: #f0f0f0;
        }

        .temp-sensor {
            border-left-color: #f39c12;
        }

        .flow-sensor {
            border-left-color: #1abc9c;
        }

        .sensor-title {
            font-size: 12px;
            color: #7f8c8d;
            margin-bottom: 6px;
            font-weight: 500;
            line-height: 1.2;
        }

        .temp-display {
            display: flex;
            align-items: baseline;
            justify-content: flex-start;
        }

        .temp-value {
            font-size: 28px;
            font-weight: 300;
            font-family: 'Courier New', monospace;
            color: #2c3e50;
            line-height: 1;
        }

        .temp-unit {
            font-size: 12px;
            color: #95a5a6;
            margin-left: 4px;
        }

        .flow-value {
            font-size: 24px;
            font-weight: 300;
            font-family: 'Courier New', monospace;
            color: #2c3e50;
        }

        .flow-unit {
            font-size: 11px;
            color: #95a5a6;
            margin-left: 4px;
        }

        .section-title {
            font-size: 14px;
            margin-bottom: 12px;
            padding-bottom: 6px;
            border-bottom: 2px solid #ecf0f1;
            color: #2c3e50;
            font-weight: 500;
        }

        .update-time {
            font-size: 10px;
            color: #95a5a6;
            margin-top: 6px;
        }

        /* Internal Header */
        .internal-header {
            text-align: center;
            padding: 5px;
            margin-bottom: 5px;
            border-bottom: 1px solid #ecf0f1;
            color: #2c3e50;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 1px;
        }

        /* Status Messages */
        .status-bar {
            padding: 8px;
            margin: 5px 10px;
            border-radius: 5px;
            font-size: 15px;
            font-weight: 400;
            text-align: center;
            border: 1px solid;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .status-ok {
            background: #d5f5e3;
            color: #27ae60;
            border-color: #27ae60;
        }

        .status-warning {
            background: #f9e79f;
            color: #9a7d0a;
            border-color: #f1c40f;
        }

        .status-error {
            background: #fadbd8;
            color: #c0392b;
            border-color: #e74c3c;
        }

        .status-icon {
            width: 16px;
            height: 16px;
            display: inline-block;
        }

        /* Вертикальный макет (мобильные устройства) */
        @media (max-width: 900px) {
            .main-panel {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto;
                height: auto;
            }

            .scheme-container {
                height: auto;
                min-height: 480px;
                aspect-ratio: 530 / 480;
            }

            .sensors-panel {
                height: auto;
                max-height: 50vh;
            }

            .sensors-content {
                overflow-y: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-panel">
            <div class="scheme-container">
                <div class="internal-header">Moonshine v1.1.5</div>
                <div id="statusBar" class="status-bar status-ok">
                    <span class="status-icon" id="statusIcon">✓</span>
                    <span id="statusText">Система работает нормально</span>
                </div>
                <svg class="distillation-svg" viewBox="0 0 530 480" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
                    <defs>
                        <!-- Dynamic Gradients -->
                        <linearGradient id="columnGradient" x1="0%" y1="100%" x2="0%" y2="0%">
                            <stop offset="0%" stop-color="#e74c3c" id="colStopLow"/>
                            <stop offset="100%" stop-color="#f39c12" id="colStopHigh"/>
                        </linearGradient>
                        <linearGradient id="vaporGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#e67e22" id="vapStopLow"/>
                            <stop offset="100%" stop-color="#3498db" id="vapStopHigh"/>
                        </linearGradient>

                        <!-- DF Output Pipe Gradient (vertical part only): 20°C (blue) to DF.T -->
                        <linearGradient id="dfOutGradient" x1="0%" y1="100%" x2="0%" y2="0%">
                            <stop offset="0%" stop-color="#3498db" id="dfOutStopLow"/>
                            <stop offset="100%" stop-color="#f39c12" id="dfOutStopHigh"/>
                        </linearGradient>

                        <!-- Cool Output Pipe Gradient (vertical part only): 20°C (blue) to Cool.T -->
                        <linearGradient id="coolOutGradient" x1="0%" y1="100%" x2="0%" y2="0%">
                            <stop offset="0%" stop-color="#3498db" id="coolOutStopLow"/>
                            <stop offset="100%" stop-color="#3498db" id="coolOutStopHigh"/>
                        </linearGradient>

                        <!-- Warning Icon Definition: Taller Triangle -->
                        <g id="warningSymbol">
                            <!-- Triangle: Taller to fit text -->
                            <path d="M 0,-11 L 9,6 L -9,6 Z" fill="#f1c40f" stroke="#d35400" stroke-width="1"/>
                            <!-- Exclamation Mark: Adjusted position -->
                            <path d="M 0,-5 L 0,1" stroke="#2c3e50" stroke-width="2.5" stroke-linecap="round"/>
                            <circle cx="0" cy="4" r="1.2" fill="#2c3e50"/>
                        </g>

                        <!-- Drop Shape -->
                        <path id="dropShape" d="M 0,0 Q -4,-4 0,-10 Q 4,-4 0,0" fill="#3498db" opacity="0.8"/>
                    </defs>

                    <!-- COLUMN (Колонна) -->
                    <rect x="210" y="200" width="30" height="150" class="column" fill="url(#columnGradient)" id="column"/>

                    <!-- HEATER (Нагревательный бак) -->
                    <rect x="165" y="350" width="120" height="80" rx="5" class="heater" id="heater"/>

                    <!-- Liquid Level (80%) -->
                    <rect x="167" y="366" width="116" height="62" rx="3" class="heater-liquid" id="heaterLiquid"/>

                    <!-- Bubbles Group -->
                    <g id="heaterBubbles">
                        <circle cx="180" cy="420" r="2" class="bubble bubble-speed-1" style="animation-delay: 0s;"/>
                        <circle cx="200" cy="415" r="2.5" class="bubble bubble-speed-1" style="animation-delay: 1.2s;"/>
                        <circle cx="220" cy="425" r="2" class="bubble bubble-speed-1" style="animation-delay: 2.4s;"/>
                        <circle cx="240" cy="410" r="2.5" class="bubble bubble-speed-1" style="animation-delay: 0.6s;"/>
                        <circle cx="260" cy="420" r="2" class="bubble bubble-speed-1" style="animation-delay: 3.0s;"/>
                        <circle cx="190" cy="405" r="1.8" class="bubble bubble-speed-1" style="animation-delay: 1.8s;"/>
                        <circle cx="210" cy="400" r="2.2" class="bubble bubble-speed-1" style="animation-delay: 3.6s;"/>
                        <circle cx="230" cy="408" r="1.8" class="bubble bubble-speed-1" style="animation-delay: 0.9s;"/>
                    </g>

                    <text x="225" y="402" text-anchor="middle" fill="#2c3e50" font-size="14" font-weight="500">Heater</text>

                    <!-- Temperature display for Heater -->
                    <rect x="185" y="354" width="85" height="32" rx="3" class="temp-rect" id="rectHeater"/>
                    <text x="227.5" y="370" class="temp-text" id="valueHeaterNum">78.5°</text>

                    <!-- Heating element -->
                    <rect x="195" y="405" width="60" height="12" rx="3" fill="#e74c3c" opacity="0.3"/>

                    <!-- Temperature display for Steam -->
                    <rect x="185" y="37" width="85" height="32" rx="3" class="temp-rect" id="rectSteam"/>
                    <text x="227.5" y="53" class="temp-text" id="valueSteamNum">78.2°</text>
                    <text x="225" y="32" text-anchor="middle" class="temp-label">Steam</text>

                    <!-- PIPES -->

                    <!-- 180 degree turn pipe (Vapor) -->
                    <path d="M 225 110 L 225 80 L 315 80 L 315 110" class="vapor-pipe" stroke="url(#vaporGradient)" fill="none"/>

                    <!-- Product output -->
                    <path d="M 315 200 L 315 240" class="product-pipe" id="productPipe"/>
                    <text x="315" y="255" text-anchor="middle" fill="#7f8c8d" font-size="10">Product</text>
                    <!-- Drop Indicator -->
                    <g id="dropIndicator" transform="translate(315, 270)" style="display: none;">
                        <use href="#dropShape"/>
                    </g>

                    <!-- DEFLEGMATOR (Дефлегматор) -->
                    <rect x="185" y="110" width="80" height="90" rx="5" class="deflegmator" id="deflegmator"/>
                    <text x="225" y="155" text-anchor="middle" fill="#2c3e50" font-size="10">Deflegmator</text>

                    <!-- Inner tube for deflegmator -->
                    <rect x="210" y="120" width="30" height="70" rx="3" fill="#27ae60" opacity="0.2"/>

                    <!-- CONDENSER (Конденсер) -->
                    <rect x="275" y="110" width="80" height="90" rx="5" class="condenser" id="condenser"/>
                    <text x="315" y="155" text-anchor="middle" fill="#2c3e50" font-size="10">Condenser</text>

                    <!-- Inner tube for condenser -->
                    <rect x="300" y="120" width="30" height="70" rx="3" fill="#3498db" opacity="0.2"/>

                    <!-- Water pipes for deflegmator -->
                    <!-- Input: go right to center first, then up -->
                    <path d="M 175 190 L 225 190 L 225 165" class="pipe water-pipe-in" id="dfWaterInPipe"/>
                    <!-- Output -->
                    <path d="M 225 135 L 132.5 135 L 132.5 117" class="pipe water-pipe-out" id="dfWaterOutPipe"/>

                    <!-- Water pipes for condenser -->
                    <!-- Input: go left to center first, then up -->
                    <path d="M 365 190 L 315 190 L 315 165" class="pipe water-pipe-in" id="coolWaterInPipe"/>
                    <!-- Output -->
                    <path d="M 315 135 L 407.5 135 L 407.5 117" class="pipe water-pipe-out" id="coolWaterOutPipe"/>

                    <!-- FLOW SENSORS -->
                    <!-- DF.Flow -->
                    <g id="sensorDFFlow">
                        <rect x="145" y="180" width="30" height="20" rx="3" class="sensor-flow-rect"/>
                        <!-- Wheel Group -->
                        <g class="flow-wheel-group" id="wheelDFGroup">
                            <circle cx="160" cy="190" r="6" class="flow-wheel"/>
                            <line x1="160" y1="184" x2="160" y2="196" class="flow-wheel-line"/>
                            <line x1="154" y1="190" x2="166" y2="190" class="flow-wheel-line"/>
                        </g>
                        <!-- Warning Icon Group -->
                        <g id="warningDF" class="warning-icon" transform="translate(160, 192)">
                            <use href="#warningSymbol"/>
                        </g>

                        <!-- Flow Value Display -->
                        <rect x="120" y="207" width="80" height="38" rx="3" class="flow-value-rect"/>
                        <text x="160" y="222" class="flow-text" id="svgValueDFFlow">250</text>
                        <text x="160" y="238" class="flow-unit-text">ml/min</text>
                    </g>

                    <!-- Cool.Flow -->
                    <g id="sensorCoolFlow">
                        <rect x="365" y="180" width="30" height="20" rx="3" class="sensor-flow-rect"/>
                        <!-- Wheel Group -->
                        <g class="flow-wheel-group" id="wheelCoolGroup">
                            <circle cx="380" cy="190" r="6" class="flow-wheel"/>
                            <line x1="380" y1="184" x2="380" y2="196" class="flow-wheel-line"/>
                            <line x1="374" y1="190" x2="386" y2="190" class="flow-wheel-line"/>
                        </g>
                        <!-- Warning Icon Group -->
                        <g id="warningCool" class="warning-icon" transform="translate(380, 192)">
                            <use href="#warningSymbol"/>
                        </g>

                        <!-- Flow Value Display -->
                        <rect x="340" y="207" width="80" height="38" rx="3" class="flow-value-rect"/>
                        <text x="380" y="222" class="flow-text" id="svgValueCoolFlow">180</text>
                        <text x="380" y="238" class="flow-unit-text">ml/min</text>
                    </g>

                    <!-- Temperature displays on output pipes -->
                    <!-- DF.T -->
                    <rect x="90" y="85" width="85" height="32" rx="3" class="temp-rect" id="rectDFT"/>
                    <text x="132.5" y="101" class="temp-text" id="valueDFTNum">28.3°</text>

                    <!-- Cool.T -->
                    <rect x="365" y="85" width="85" height="32" rx="3" class="temp-rect" id="rectCoolT"/>
                    <text x="407.5" y="101" class="temp-text" id="valueCoolTNum">22.1°</text>
                </svg>
            </div>

            <div class="sensors-panel">
                <div class="sensors-content">
                    <div class="section-title">Температура</div>

                    <!-- Reordered: Steam, DF, Cool, Heater -->
                    <div class="sensor-card temp-sensor">
                        <div class="sensor-title">Steam - Верх колонны</div>
                        <div class="temp-display">
                            <div class="temp-value" id="cardValueSteam">78.2</div>
                            <div class="temp-unit">°C</div>
                        </div>
                    </div>

                    <div class="sensor-card temp-sensor">
                        <div class="sensor-title">DF.T - Дефлегматор (выход)</div>
                        <div class="temp-display">
                            <div class="temp-value" id="cardValueDFT">28.3</div>
                            <div class="temp-unit">°C</div>
                        </div>
                    </div>

                    <div class="sensor-card temp-sensor">
                        <div class="sensor-title">Cool.T - Конденсер (выход)</div>
                        <div class="temp-display">
                            <div class="temp-value" id="cardValueCoolT">22.1</div>
                            <div class="temp-unit">°C</div>
                        </div>
                    </div>

                    <div class="sensor-card temp-sensor">
                        <div class="sensor-title">Heater - Температура в баке</div>
                        <div class="temp-display">
                            <div class="temp-value" id="cardValueHeater">78.5</div>
                            <div class="temp-unit">°C</div>
                        </div>
                    </div>

                    <div class="section-title" style="margin-top: 20px;">Поток воды</div>

                    <div class="sensor-card flow-sensor">
                        <div class="sensor-title">DF.Flow - Дефлегматор</div>
                        <div style="display: flex; align-items: baseline;">
                            <div class="flow-value" id="cardValueDFFlow">250</div>
                            <div class="flow-unit">ml/min</div>
                        </div>
                    </div>

                    <div class="sensor-card flow-sensor">
                        <div class="sensor-title">Cool.Flow - Конденсер</div>
                        <div style="display: flex; align-items: baseline;">
                            <div class="flow-value" id="cardValueCoolFlow">180</div>
                            <div class="flow-unit">ml/min</div>
                        </div>
                    </div>

                    <div class="update-time">Обновлено: <span id="lastUpdate">--:--:--</span></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // CONFIGURATION: Color Blender
        // ============================================
        // Ключевые точки для интерполяции цвета по температуре.
        // Формат: { temp: температура_°C, color: "#hex" }
        // Можно добавлять/удалять точки для настройки цветовой схемы.
        // ============================================
        const COLOR_BLENDER = [
            { temp: 15, color: "#2980b9" },   // Тёмно-синий (холодный)
            { temp: 20, color: "#3498db" },   // Синий
            { temp: 25, color: "#f1c40f" },   // Жёлтый
            { temp: 28, color: "#e67e22" },   // Оранжевый
            { temp: 30, color: "#e74c3c" },   // Красный
            { temp: 35, color: "#c0392b" }    // Тёмно-красный (горячий)
        ];

        // ============================================
        // Simulation State
        // ============================================
        const simState = {
            phase: 'HEAT', // HEAT, OSCILLATE, COOL, PAUSE
            phaseStartTime: Date.now()
        };

        // Simulation data container
        const sensorData = {
            Heater: { value: 20.0, min: 20, max: 95 },
            Steam: { value: 20.0, min: 20, max: 95 },
            DFT: { value: 20.0, min: 15, max: 40 },
            CoolT: { value: 20.0, min: 15, max: 35 },
            DFFlow: { value: 0, min: 0, max: 400 },
            CoolFlow: { value: 0, min: 0, max: 400 }
        };

        // ============================================
        // Color Blender Helper
        // ============================================
        // Parse hex color to RGB object
        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : { r: 0, g: 0, b: 0 };
        }

        // RGB object to CSS rgb() string
        function rgbToString(rgb) {
            return `rgb(${Math.round(rgb.r)}, ${Math.round(rgb.g)}, ${Math.round(rgb.b)})`;
        }

        // Get interpolated color for a given temperature
        function getTempColor(temp) {
            if (COLOR_BLENDER.length === 0) return '#2c3e50';
            if (COLOR_BLENDER.length === 1) return COLOR_BLENDER[0].color;

            // Sort by temperature (just in case)
            const sorted = [...COLOR_BLENDER].sort((a, b) => a.temp - b.temp);

            // Below minimum: return first color
            if (temp <= sorted[0].temp) return sorted[0].color;

            // Above maximum: return last color
            if (temp >= sorted[sorted.length - 1].temp) return sorted[sorted.length - 1].color;

            // Find two nearest points
            for (let i = 0; i < sorted.length - 1; i++) {
                if (temp >= sorted[i].temp && temp <= sorted[i + 1].temp) {
                    const lower = sorted[i];
                    const upper = sorted[i + 1];
                    const ratio = (temp - lower.temp) / (upper.temp - lower.temp);

                    const lowerRgb = hexToRgb(lower.color);
                    const upperRgb = hexToRgb(upper.color);

                    const interpolated = {
                        r: lowerRgb.r + ratio * (upperRgb.r - lowerRgb.r),
                        g: lowerRgb.g + ratio * (upperRgb.g - lowerRgb.g),
                        b: lowerRgb.b + ratio * (upperRgb.b - lowerRgb.b)
                    };

                    return rgbToString(interpolated);
                }
            }

            return sorted[sorted.length - 1].color;
        }

        // ============================================
        // Simulation Logic
        // ============================================
        function updateSimulationLogic() {
            const now = Date.now();
            const elapsed = (now - simState.phaseStartTime) / 1000; // seconds

            if (simState.phase === 'HEAT') {
                // Heat from 20 to 80 in 60 seconds
                sensorData.Heater.value = 20 + (elapsed * 1.0);
                if (sensorData.Heater.value >= 80) {
                    sensorData.Heater.value = 80;
                    simState.phase = 'OSCILLATE';
                    simState.phaseStartTime = now;
                }
            } else if (simState.phase === 'OSCILLATE') {
                // Oscillate for 30s. Amp=5, Period=10s. Base=80.
                const oscillation = 5 * Math.sin(2 * Math.PI * (elapsed / 10));
                sensorData.Heater.value = 80 + oscillation;

                if (elapsed >= 30) {
                    simState.phase = 'COOL';
                    simState.phaseStartTime = now;
                }
            } else if (simState.phase === 'COOL') {
                // Cool from 80 to 20 in 60 seconds
                sensorData.Heater.value = 80 - (elapsed * 1.0);
                if (sensorData.Heater.value <= 20) {
                    sensorData.Heater.value = 20;
                    simState.phase = 'PAUSE';
                    simState.phaseStartTime = now;
                }
            } else if (simState.phase === 'PAUSE') {
                // Pause at 20 for 30 seconds
                sensorData.Heater.value = 20;
                if (elapsed >= 30) {
                    simState.phase = 'HEAT';
                    simState.phaseStartTime = now;
                }
            }

            // Steam Logic: Starts after Heater > 65, value = Heater - 5
            if (sensorData.Heater.value > 65) {
                sensorData.Steam.value = sensorData.Heater.value - 5;
            } else {
                if (sensorData.Steam.value > sensorData.Heater.value - 5) {
                    sensorData.Steam.value -= 0.5;
                }
                if (sensorData.Steam.value < 20) sensorData.Steam.value = 20;
            }

            // Flow Logic: On if Heater > 60
            const flowTarget = sensorData.Heater.value > 60 ? 250 : 0;

            // Smooth transition for flow
            if (sensorData.DFFlow.value < flowTarget) sensorData.DFFlow.value += 5;
            if (sensorData.DFFlow.value > flowTarget) sensorData.DFFlow.value -= 5;

            // Add noise
            if (flowTarget > 0) {
                sensorData.DFFlow.value += (Math.random() - 0.5) * 5;
                sensorData.CoolFlow.value = sensorData.DFFlow.value + (Math.random() - 0.5) * 5;
            } else {
                sensorData.DFFlow.value = 0;
                sensorData.CoolFlow.value = 0;
            }

            // Output Temps Logic
            const steamTemp = sensorData.Steam.value;
            let targetDFT = 20;

            // NEW RULE: DF.T rises from 22 at Steam=65 to 35 at Steam=80
            if (steamTemp > 65) {
                // Linear interpolation: 22 at 65°C, 35 at 80°C
                targetDFT = 22 + ((steamTemp - 65) / 15) * 13;
            }

            if (sensorData.DFT.value < targetDFT) sensorData.DFT.value += 0.05;
            if (sensorData.DFT.value > targetDFT) sensorData.DFT.value -= 0.05;

            if (flowTarget > 0) {
                if (sensorData.CoolT.value < 25) sensorData.CoolT.value += 0.05;
            } else {
                if (sensorData.CoolT.value > 20) sensorData.CoolT.value -= 0.2;
            }
        }

        // ============================================
        // Rules System
        // ============================================
        function checkRules() {
            const messages = [];
            const { Heater, CoolFlow, CoolT, DFT, DFFlow } = sensorData;

            // Rule 2: Heater > 55 AND Cool.Flow = 0
            if (Heater.value > 55 && CoolFlow.value === 0) {
                messages.push({ type: 'warning', text: 'Включите подачу воды в охладитель' });
            }

            // Rule 3: Cool.T > 30
            if (CoolT.value > 30) {
                if (CoolFlow.value === 0) {
                    messages.push({ type: 'error', text: 'Нет воды в охладителе!' });
                } else {
                    messages.push({ type: 'warning', text: 'Добавьте воды в охладитель' });
                }
            }

            // Rule 4: DF.T > 30
            if (DFT.value > 30) {
                if (DFFlow.value === 0) {
                    messages.push({ type: 'error', text: 'Нет воды в дефлегматоре!' });
                } else {
                    messages.push({ type: 'warning', text: 'Добавьте воды в дефлегматор' });
                }
            }

            // Rule 1: If no errors or warnings
            if (messages.length === 0) {
                messages.push({ type: 'ok', text: 'Система работает нормально' });
            }

            return messages;
        }

        function updateStatusBar() {
            const messages = checkRules();
            const statusBar = document.getElementById('statusBar');
            const statusIcon = document.getElementById('statusIcon');
            const statusText = document.getElementById('statusText');

            // Find highest priority message (error > warning > ok)
            const priority = { error: 3, warning: 2, ok: 1 };
            const highestPriority = messages.reduce((prev, current) =>
                priority[current.type] > priority[prev.type] ? current : prev
            );

            statusBar.className = 'status-bar';
            statusBar.classList.add(`status-${highestPriority.type}`);

            // Set icon based on type
            if (highestPriority.type === 'ok') {
                statusIcon.textContent = '✓';
            } else if (highestPriority.type === 'warning') {
                statusIcon.textContent = '⚠';
            } else if (highestPriority.type === 'error') {
                statusIcon.textContent = '✕';
            }

            statusText.textContent = highestPriority.text;
        }

        function getColumnColors(heaterTemp, steamTemp) {
            const lowColor = getTempColor(heaterTemp > 35 ? 35 : heaterTemp);
            const highColor = getTempColor(steamTemp > 35 ? 35 : steamTemp);
            return { low: lowColor, high: highColor };
        }

        function formatTemp(value) {
            return value.toFixed(1);
        }

        function getFlowWheelClass(flow) {
            if (flow < 150) return 'flow-wheel-slow';
            if (flow < 250) return 'flow-wheel-medium';
            return 'flow-wheel-fast';
        }

        function getFlowPipeClass(flow) {
            if (flow < 150) return 'flow-slow';
            if (flow < 250) return 'flow-medium';
            return 'flow-fast';
        }

        function updateDropIndicator(steamTemp) {
            const drop = document.getElementById('dropIndicator');
            if (!drop) return;

            if (steamTemp < 65) {
                drop.style.display = 'none';
                drop.classList.remove('drop-blink-1hz', 'drop-blink-2hz', 'drop-blink-4hz');
            } else {
                drop.style.display = 'block';
                drop.classList.remove('drop-blink-1hz', 'drop-blink-2hz', 'drop-blink-4hz');

                if (steamTemp >= 75) {
                    drop.classList.add('drop-blink-4hz');
                } else if (steamTemp >= 70) {
                    drop.classList.add('drop-blink-2hz');
                } else {
                    drop.classList.add('drop-blink-1hz');
                }
            }
        }

        function updateHeaterBubbles(heaterTemp) {
            const bubbles = document.querySelectorAll('.bubble');
            if (!bubbles.length) return;

            // Determine speed class based on temperature ranges (60 to 90+)
            let speedClass = '';

            if (heaterTemp > 90) speedClass = 'bubble-speed-7';
            else if (heaterTemp > 85) speedClass = 'bubble-speed-6';
            else if (heaterTemp > 80) speedClass = 'bubble-speed-5';
            else if (heaterTemp > 75) speedClass = 'bubble-speed-4';
            else if (heaterTemp > 70) speedClass = 'bubble-speed-3';
            else if (heaterTemp > 65) speedClass = 'bubble-speed-2';
            else if (heaterTemp > 60) speedClass = 'bubble-speed-1';

            bubbles.forEach(bubble => {
                // Remove all speed classes
                bubble.classList.remove('bubble-speed-1', 'bubble-speed-2', 'bubble-speed-3',
                                       'bubble-speed-4', 'bubble-speed-5', 'bubble-speed-6', 'bubble-speed-7');

                if (speedClass) {
                    bubble.classList.add(speedClass);
                    bubble.style.display = 'block';
                } else {
                    bubble.style.display = 'none';
                }
            });
        }

        function updateSensors() {
            updateSimulationLogic();

            for (let sensor in sensorData) {
                const data = sensorData[sensor];

                data.value = Math.max(data.min, Math.min(data.max, data.value));

                const numElement = document.getElementById(`value${sensor}Num`);
                const svgFlowElement = document.getElementById(`svgValue${sensor}`);

                if (numElement) {
                    if (!sensor.includes('Flow')) {
                        numElement.textContent = formatTemp(data.value) + '°';
                    }
                }

                if (svgFlowElement) {
                    svgFlowElement.textContent = data.value.toFixed(0);
                }

                const cardElement = document.getElementById(`cardValue${sensor}`);
                if (cardElement) {
                    if (sensor.includes('Flow')) {
                        cardElement.textContent = data.value.toFixed(0);
                    } else {
                        cardElement.textContent = formatTemp(data.value);
                    }
                }

                // Handle Flow Sensors (Wheel vs Warning)
                if (sensor.includes('Flow')) {
                    const isNoFlow = data.value < 10;
                    const wheelGroup = document.getElementById(sensor === 'DFFlow' ? 'wheelDFGroup' : 'wheelCoolGroup');
                    const warningIcon = document.getElementById(sensor === 'DFFlow' ? 'warningDF' : 'warningCool');

                    if (wheelGroup && warningIcon) {
                        if (isNoFlow) {
                            wheelGroup.style.display = 'none';
                            warningIcon.style.display = 'block';

                            const pipeId = sensor === 'DFFlow' ? 'dfWaterInPipe' : 'coolWaterInPipe';
                            const pipe = document.getElementById(pipeId);
                            if(pipe) {
                                pipe.classList.remove('flow-slow', 'flow-medium', 'flow-fast');
                                pipe.style.strokeDasharray = 'none';
                            }
                        } else {
                            wheelGroup.style.display = 'block';
                            warningIcon.style.display = 'none';

                            const pipeId = sensor === 'DFFlow' ? 'dfWaterInPipe' : 'coolWaterInPipe';
                            const pipe = document.getElementById(pipeId);
                            if (pipe) {
                                pipe.classList.remove('flow-slow', 'flow-medium', 'flow-fast');
                                pipe.classList.add(getFlowPipeClass(data.value));
                                pipe.style.strokeDasharray = '';
                            }

                            if (wheelGroup) {
                                wheelGroup.classList.remove('flow-wheel-slow', 'flow-wheel-medium', 'flow-wheel-fast');
                                wheelGroup.classList.add(getFlowWheelClass(data.value));
                            }
                        }
                    }
                }

                // Update output pipe colors and animations
                if (sensor === 'DFT') {
                    const outPipe = document.getElementById('dfWaterOutPipe');
                    if (outPipe) {
                        outPipe.style.stroke = getTempColor(data.value);
                        if (sensorData.DFFlow.value >= 10) {
                            outPipe.classList.remove('flow-slow', 'flow-medium', 'flow-fast');
                            outPipe.classList.add(getFlowPipeClass(sensorData.DFFlow.value));
                            outPipe.style.strokeDasharray = '';
                        } else {
                            outPipe.classList.remove('flow-slow', 'flow-medium', 'flow-fast');
                            outPipe.style.strokeDasharray = 'none';
                        }
                    }
                    // Update DF output pipe gradient (vertical part)
                    document.getElementById('dfOutStopHigh').setAttribute('stop-color', getTempColor(data.value));
                }

                if (sensor === 'CoolT') {
                    const outPipe = document.getElementById('coolWaterOutPipe');
                    if (outPipe) {
                        outPipe.style.stroke = getTempColor(data.value);
                        if (sensorData.CoolFlow.value >= 10) {
                            outPipe.classList.remove('flow-slow', 'flow-medium', 'flow-fast');
                            outPipe.classList.add(getFlowPipeClass(sensorData.CoolFlow.value));
                            outPipe.style.strokeDasharray = '';
                        } else {
                            outPipe.classList.remove('flow-slow', 'flow-medium', 'flow-fast');
                            outPipe.style.strokeDasharray = 'none';
                        }
                    }
                    // Update Cool output pipe gradient (vertical part)
                    document.getElementById('coolOutStopHigh').setAttribute('stop-color', getTempColor(data.value));
                }
            }

            // Update Gradients
            const colColors = getColumnColors(sensorData.Heater.value, sensorData.Steam.value);
            document.getElementById('colStopLow').setAttribute('stop-color', colColors.low);
            document.getElementById('colStopHigh').setAttribute('stop-color', colColors.high);

            const steamColor = getTempColor(sensorData.Steam.value > 35 ? 35 : sensorData.Steam.value);
            const coolColor = getTempColor(sensorData.CoolT.value);

            document.getElementById('vapStopLow').setAttribute('stop-color', steamColor);
            document.getElementById('vapStopHigh').setAttribute('stop-color', coolColor);

            // Update Heater Border Color
            const heaterElement = document.getElementById('heater');
            if (heaterElement) {
                heaterElement.style.stroke = getTempColor(sensorData.Heater.value);
            }

            // Update Drop Indicator
            updateDropIndicator(sensorData.Steam.value);

            // Update Heater Bubbles
            updateHeaterBubbles(sensorData.Heater.value);

            // Update Status Bar (Rules)
            updateStatusBar();

            const now = new Date();
            document.getElementById('lastUpdate').textContent = now.toLocaleTimeString('ru-RU');
        }

        updateSensors();
        setInterval(updateSensors, 100);
    </script>
