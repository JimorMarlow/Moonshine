<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moonshine - Monitoring</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding: 10px;
            color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }

        .main-panel {
            display: grid;
            grid-template-columns: 1fr 240px;
            gap: 15px;
        }

        .scheme-container {
            background: #ffffff;
            border-radius: 8px;
            padding: 5px 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border: 1px solid #e0e0e0;
            position: relative;
            overflow: hidden;
        }

        .sensors-panel {
            background: #ffffff;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border: 1px solid #e0e0e0;
            height: fit-content;
        }

        .distillation-svg {
            width: 100%;
            height: auto;
            min-height: 600px;
            display: block;
        }

        /* Components - Minimalist style */
        .heater {
            fill: #ffffff;
            stroke: #e74c3c;
            stroke-width: 2.5;
        }

        .column {
            stroke: #34495e;
            stroke-width: 2.5;
        }

        .deflegmator {
            fill: #ffffff;
            stroke: #27ae60;
            stroke-width: 2.5;
        }

        .condenser {
            fill: #ffffff;
            stroke: #3498db;
            stroke-width: 2.5;
        }

        .pipe {
            fill: none;
            stroke: #95a5a6;
            stroke-width: 4;
            stroke-linecap: round;
        }

        .vapor-pipe {
            stroke-width: 8;
            stroke-linecap: round;
        }

        .water-pipe-in {
            stroke: #3498db;
            stroke-width: 4;
        }

        .water-pipe-out {
            stroke-width: 4;
        }

        /* Temperature display rectangles */
        .temp-rect {
            fill: #ffffff;
            stroke: #f39c12;
            stroke-width: 1;
        }

        /* Flow value display rectangles */
        .flow-value-rect {
            fill: #ffffff;
            stroke: #1abc9c;
            stroke-width: 1;
        }

        /* Combined temperature text style */
        .temp-text, .flow-text {
            font-size: 24px;
            font-weight: 300;
            fill: #2c3e50;
            text-anchor: middle;
            font-family: 'Courier New', monospace;
            dominant-baseline: middle;
        }
        
        .flow-unit-text {
            font-size: 12px;
            font-weight: 500;
            fill: #7f8c8d;
            text-anchor: middle;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            dominant-baseline: middle;
        }

        .temp-label {
            font-size: 14px;
            fill: #7f8c8d;
            text-anchor: middle;
            font-weight: 500;
        }

        /* Flow sensors with rotating wheels */
        .sensor-flow-rect {
            fill: #1abc9c;
            stroke: #16a085;
            stroke-width: 2;
            cursor: pointer;
        }

        .flow-wheel-group {
            transform-box: fill-box;
            transform-origin: center;
        }

        .flow-wheel-slow {
            animation: rotate 3s linear infinite;
        }

        .flow-wheel-medium {
            animation: rotate 1.5s linear infinite;
        }

        .flow-wheel-fast {
            animation: rotate 0.7s linear infinite;
        }

        .flow-wheel {
            fill: none;
            stroke: #ffffff;
            stroke-width: 2;
        }
        
        .flow-wheel-line {
            stroke: #ffffff;
            stroke-width: 2;
            stroke-linecap: round;
        }

        /* Warning Icon */
        .warning-icon {
            display: none;
        }
        
        .warning-icon path {
            fill: #e74c3c;
        }
        
        .warning-icon text {
            fill: #ffffff;
            font-size: 8px;
            font-weight: bold;
            text-anchor: middle;
            dominant-baseline: middle;
            font-family: sans-serif;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Flow animation */
        .flow-slow {
            stroke-dasharray: 10, 10;
            animation: flowAnimation 2s linear infinite;
        }

        .flow-medium {
            stroke-dasharray: 8, 8;
            animation: flowAnimation 1s linear infinite;
        }

        .flow-fast {
            stroke-dasharray: 5, 5;
            animation: flowAnimation 0.5s linear infinite;
        }

        @keyframes flowAnimation {
            to {
                stroke-dashoffset: -20;
            }
        }

        /* Sensor Cards - Minimalist */
        .sensor-card {
            background: #fafafa;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 10px;
            border-left: 4px solid;
            transition: all 0.3s;
        }

        .sensor-card:hover {
            background: #f0f0f0;
        }

        .temp-sensor {
            border-left-color: #f39c12;
        }

        .flow-sensor {
            border-left-color: #1abc9c;
        }

        .sensor-title {
            font-size: 12px;
            color: #7f8c8d;
            margin-bottom: 6px;
            font-weight: 500;
            line-height: 1.2;
        }

        .temp-display {
            display: flex;
            align-items: baseline;
            justify-content: flex-start;
        }

        .temp-value {
            font-size: 28px;
            font-weight: 300;
            font-family: 'Courier New', monospace;
            color: #2c3e50;
            line-height: 1;
        }

        .temp-unit {
            font-size: 12px;
            color: #95a5a6;
            margin-left: 4px;
        }

        .flow-value {
            font-size: 24px;
            font-weight: 300;
            font-family: 'Courier New', monospace;
            color: #2c3e50;
        }

        .flow-unit {
            font-size: 11px;
            color: #95a5a6;
            margin-left: 4px;
        }

        .section-title {
            font-size: 14px;
            margin-bottom: 12px;
            padding-bottom: 6px;
            border-bottom: 2px solid #ecf0f1;
            color: #2c3e50;
            font-weight: 500;
        }

        .status-text {
            font-size: 11px;
            color: #27ae60;
            margin-top: 10px;
        }

        .update-time {
            font-size: 10px;
            color: #95a5a6;
            margin-top: 6px;
        }
        
        /* Internal Header */
        .internal-header {
            text-align: center;
            padding-bottom: 8px;
            margin-bottom: 8px;
            border-bottom: 1px solid #ecf0f1;
            color: #2c3e50;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 1px;
        }

        @media (max-width: 900px) {
            .main-panel {
                grid-template-columns: 1fr;
            }
            
            .distillation-svg {
                min-height: 550px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-panel">
            <div class="scheme-container">
                <div class="internal-header">Moonshine v.1.0.10</div>
                <svg class="distillation-svg" viewBox="0 0 700 620" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <!-- Dynamic Gradients -->
                        <linearGradient id="columnGradient" x1="0%" y1="100%" x2="0%" y2="0%">
                            <stop offset="0%" stop-color="#e74c3c" id="colStopLow"/>
                            <stop offset="100%" stop-color="#f39c12" id="colStopHigh"/>
                        </linearGradient>
                        <linearGradient id="vaporGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#e67e22" id="vapStopLow"/>
                            <stop offset="100%" stop-color="#3498db" id="vapStopHigh"/>
                        </linearGradient>
                        
                        <!-- Warning Icon Definition -->
                        <g id="warningSymbol">
                            <path d="M -5 -4 L 5 -4 L 0 5 Z" fill="#e74c3c" stroke="#c0392b" stroke-width="0.5"/>
                            <text x="0" y="1" font-size="8" fill="white" text-anchor="middle" dominant-baseline="middle" font-weight="bold">!</text>
                        </g>
                    </defs>

                    <!-- HEATER (Нагревательный бак) -->
                    <rect x="270" y="470" width="120" height="80" rx="5" class="heater" id="heater"/>
                    <text x="330" y="520" text-anchor="middle" fill="#2c3e50" font-size="14" font-weight="500">Heater</text>
                    
                    <!-- Temperature display for Heater -->
                    <rect x="290" y="472" width="85" height="32" rx="3" class="temp-rect" id="rectHeater"/>
                    <text x="332.5" y="488" class="temp-text" id="valueHeaterNum">78.5°</text>
                    
                    <!-- Heating element -->
                    <rect x="300" y="525" width="60" height="12" rx="3" fill="#e74c3c" opacity="0.3"/>
                    
                    <!-- COLUMN (Колонна) -->
                    <rect x="315" y="320" width="30" height="150" class="column" fill="url(#columnGradient)" id="column"/>
                    
                    <!-- Temperature display for Steam -->
                    <rect x="290" y="157" width="85" height="32" rx="3" class="temp-rect" id="rectSteam"/>
                    <text x="332.5" y="173" class="temp-text" id="valueSteamNum">78.2°</text>
                    <text x="330" y="152" text-anchor="middle" class="temp-label">Steam</text>

                    <!-- DEFLEGMATOR (Дефлегматор) -->
                    <rect x="290" y="230" width="80" height="90" rx="5" class="deflegmator" id="deflegmator"/>
                    <text x="330" y="275" text-anchor="middle" fill="#2c3e50" font-size="10">Deflegmator</text>
                    
                    <!-- Inner tube for deflegmator -->
                    <rect x="315" y="240" width="30" height="70" rx="3" fill="#27ae60" opacity="0.2"/>
                    
                    <!-- CONDENSER (Конденсер) -->
                    <rect x="380" y="230" width="80" height="90" rx="5" class="condenser" id="condenser"/>
                    <text x="420" y="275" text-anchor="middle" fill="#2c3e50" font-size="10">Condenser</text>
                    
                    <!-- Inner tube for condenser -->
                    <rect x="405" y="240" width="30" height="70" rx="3" fill="#3498db" opacity="0.2"/>
                    
                    <!-- Water pipes for deflegmator -->
                    <!-- Input -->
                    <path d="M 280 310 L 315 310 L 315 285 L 330 285" class="pipe water-pipe-in" id="dfWaterInPipe"/>
                    <!-- Output: Center (330) -> Horizontal to Box Center X (237.5) -> Vertical Up to Box Bottom (237) -->
                    <path d="M 330 255 L 237.5 255 L 237.5 237" class="pipe water-pipe-out" id="dfWaterOutPipe"/>

                    <!-- Water pipes for condenser -->
                    <!-- Input -->
                    <path d="M 470 310 L 435 310 L 435 285 L 420 285" class="pipe water-pipe-in" id="coolWaterInPipe"/>
                    <!-- Output: Center (420) -> Horizontal to Box Center X (512.5) -> Vertical Up to Box Bottom (237) -->
                    <path d="M 420 255 L 512.5 255 L 512.5 237" class="pipe water-pipe-out" id="coolWaterOutPipe"/>

                    <!-- 180 degree turn pipe -->
                    <path d="M 330 230 L 330 200 L 420 200 L 420 230" class="vapor-pipe" stroke="url(#vaporGradient)" fill="none"/>

                    <!-- Product output -->
                    <path d="M 420 320 L 420 360" class="pipe" stroke="#9b59b6" stroke-width="5"/>
                    <text x="420" y="375" text-anchor="middle" fill="#7f8c8d" font-size="10">Product</text>

                    <!-- FLOW SENSORS with rotating wheels -->
                    <!-- DF.Flow -->
                    <g id="sensorDFFlow">
                        <rect x="250" y="300" width="30" height="20" rx="3" class="sensor-flow-rect"/>
                        <!-- Wheel Group -->
                        <g class="flow-wheel-group" id="wheelDFGroup">
                            <circle cx="265" cy="310" r="6" class="flow-wheel"/>
                            <line x1="265" y1="304" x2="265" y2="316" class="flow-wheel-line"/>
                            <line x1="259" y1="310" x2="271" y2="310" class="flow-wheel-line"/>
                        </g>
                        <!-- Warning Icon Group -->
                        <g id="warningDF" class="warning-icon" transform="translate(265, 310)">
                            <use href="#warningSymbol"/>
                        </g>
                        
                        <!-- Flow Value Display -->
                        <rect x="225" y="327" width="80" height="38" rx="3" class="flow-value-rect"/>
                        <text x="265" y="342" class="flow-text" id="svgValueDFFlow">250</text>
                        <text x="265" y="358" class="flow-unit-text">мл/мин</text>
                    </g>

                    <!-- Cool.Flow -->
                    <g id="sensorCoolFlow">
                        <rect x="470" y="300" width="30" height="20" rx="3" class="sensor-flow-rect"/>
                        <!-- Wheel Group -->
                        <g class="flow-wheel-group" id="wheelCoolGroup">
                            <circle cx="485" cy="310" r="6" class="flow-wheel"/>
                            <line x1="485" y1="304" x2="485" y2="316" class="flow-wheel-line"/>
                            <line x1="479" y1="310" x2="491" y2="310" class="flow-wheel-line"/>
                        </g>
                        <!-- Warning Icon Group -->
                        <g id="warningCool" class="warning-icon" transform="translate(485, 310)">
                            <use href="#warningSymbol"/>
                        </g>

                        <!-- Flow Value Display -->
                        <rect x="445" y="327" width="80" height="38" rx="3" class="flow-value-rect"/>
                        <text x="485" y="342" class="flow-text" id="svgValueCoolFlow">180</text>
                        <text x="485" y="358" class="flow-unit-text">мл/мин</text>
                    </g>

                    <!-- Temperature displays on output pipes -->
                    <!-- DF.T -->
                    <rect x="195" y="205" width="85" height="32" rx="3" class="temp-rect" id="rectDFT"/>
                    <text x="237.5" y="221" class="temp-text" id="valueDFTNum">28.3°</text>
                    
                    <!-- Cool.T -->
                    <rect x="470" y="205" width="85" height="32" rx="3" class="temp-rect" id="rectCoolT"/>
                    <text x="512.5" y="221" class="temp-text" id="valueCoolTNum">22.1°</text>
                </svg>
            </div>
            
            <div class="sensors-panel">
                <div class="section-title">Температура</div>
                
                <div class="sensor-card temp-sensor">
                    <div class="sensor-title">Heater - Температура в баке</div>
                    <div class="temp-display">
                        <div class="temp-value" id="cardValueHeater">78.5</div>
                        <div class="temp-unit">°C</div>
                    </div>
                </div>
                
                <div class="sensor-card temp-sensor">
                    <div class="sensor-title">Steam - Верх колонны</div>
                    <div class="temp-display">
                        <div class="temp-value" id="cardValueSteam">78.2</div>
                        <div class="temp-unit">°C</div>
                    </div>
                </div>
                
                <div class="sensor-card temp-sensor">
                    <div class="sensor-title">DF.T - Дефлегматор (выход)</div>
                    <div class="temp-display">
                        <div class="temp-value" id="cardValueDFT">28.3</div>
                        <div class="temp-unit">°C</div>
                    </div>
                </div>
                
                <div class="sensor-card temp-sensor">
                    <div class="sensor-title">Cool.T - Конденсер (выход)</div>
                    <div class="temp-display">
                        <div class="temp-value" id="cardValueCoolT">22.1</div>
                        <div class="temp-unit">°C</div>
                    </div>
                </div>
                
                <div class="section-title" style="margin-top: 20px;">Поток воды</div>
                
                <div class="sensor-card flow-sensor">
                    <div class="sensor-title">DF.Flow - Дефлегматор</div>
                    <div style="display: flex; align-items: baseline;">
                        <div class="flow-value" id="cardValueDFFlow">250</div>
                        <div class="flow-unit">мл/мин</div>
                    </div>
                </div>
                
                <div class="sensor-card flow-sensor">
                    <div class="sensor-title">Cool.Flow - Конденсер</div>
                    <div style="display: flex; align-items: baseline;">
                        <div class="flow-value" id="cardValueCoolFlow">180</div>
                        <div class="flow-unit">мл/мин</div>
                    </div>
                </div>
                
                <div class="status-text">✓ Система работает нормально</div>
                <div class="update-time">Обновлено: <span id="lastUpdate">--:--:--</span></div>
            </div>
        </div>
    </div>

    <script>
        // Simulation State
        const simState = {
            phase: 'HEAT', // HEAT, HOLD, COOL
            phaseStartTime: Date.now(),
            heaterTarget: 85,
            heaterMin: 20
        };

        // Simulation data container
        const sensorData = {
            Heater: { value: 20.0, min: 20, max: 95 },
            Steam: { value: 20.0, min: 20, max: 95 },
            DFT: { value: 20.0, min: 15, max: 40 },
            CoolT: { value: 20.0, min: 15, max: 35 },
            DFFlow: { value: 0, min: 0, max: 400 },
            CoolFlow: { value: 0, min: 0, max: 400 }
        };

        function updateSimulationLogic() {
            const now = Date.now();
            const elapsed = (now - simState.phaseStartTime) / 1000; // seconds

            if (simState.phase === 'HEAT') {
                // Heat from 20 to 85 in 60 seconds
                // Rate: (85-20)/60 = 1.083 deg/sec
                sensorData.Heater.value += 1.1; 
                if (sensorData.Heater.value >= 85) {
                    sensorData.Heater.value = 85;
                    simState.phase = 'HOLD';
                    simState.phaseStartTime = now;
                }
            } else if (simState.phase === 'HOLD') {
                // Hold for 30 seconds
                if (elapsed >= 30) {
                    simState.phase = 'COOL';
                    simState.phaseStartTime = now;
                }
            } else if (simState.phase === 'COOL') {
                // Cool from 85 to 20 in 60 seconds
                sensorData.Heater.value -= 1.1;
                if (sensorData.Heater.value <= 20) {
                    sensorData.Heater.value = 20;
                    simState.phase = 'HEAT';
                    simState.phaseStartTime = now;
                }
            }

            // Steam Logic: Starts after Heater > 65, value = Heater - 5
            if (sensorData.Heater.value > 65) {
                sensorData.Steam.value = sensorData.Heater.value - 5;
            } else {
                // If cooling down or not hot enough, Steam lags or drops
                // Simple logic: if Heater < 65, Steam drops faster or stays low
                if (sensorData.Steam.value > sensorData.Heater.value - 5) {
                    sensorData.Steam.value -= 0.5; 
                }
                if (sensorData.Steam.value < 20) sensorData.Steam.value = 20;
            }

            // Flow Logic: On if Heater > 60
            const flowTarget = sensorData.Heater.value > 60 ? 250 : 0;
            
            // Smooth transition for flow
            if (sensorData.DFFlow.value < flowTarget) sensorData.DFFlow.value += 5;
            if (sensorData.DFFlow.value > flowTarget) sensorData.DFFlow.value -= 5;
            
            // Add noise
            if (flowTarget > 0) {
                sensorData.DFFlow.value += (Math.random() - 0.5) * 5;
                sensorData.CoolFlow.value = sensorData.DFFlow.value + (Math.random() - 0.5) * 5; // Slight diff
            } else {
                sensorData.DFFlow.value = 0;
                sensorData.CoolFlow.value = 0;
            }

            // Output Temps (Simplified simulation)
            // DF.T rises slowly with flow, Cool.T stays cooler
            if (flowTarget > 0) {
                if (sensorData.DFT.value < 30) sensorData.DFT.value += 0.1;
                if (sensorData.CoolT.value < 25) sensorData.CoolT.value += 0.05;
            } else {
                if (sensorData.DFT.value > 20) sensorData.DFT.value -= 0.2;
                if (sensorData.CoolT.value > 20) sensorData.CoolT.value -= 0.2;
            }
        }

        function getTempColor(temp) {
            if (temp <= 20) return '#3498db';
            if (temp <= 25) {
                const ratio = (temp - 20) / 5;
                const r = Math.round(52 + ratio * (241 - 52));
                const g = Math.round(152 + ratio * (196 - 152));
                const b = Math.round(219 + ratio * (15 - 219));
                return `rgb(${r},${g},${b})`;
            }
            if (temp <= 30) {
                const ratio = (temp - 25) / 5;
                const r = Math.round(241 + ratio * (231 - 241));
                const g = Math.round(196 + ratio * (76 - 196));
                const b = Math.round(15 + ratio * (60 - 15));
                return `rgb(${r},${g},${b})`;
            }
            return '#e74c3c';
        }

        function getColumnColors(heaterTemp, steamTemp) {
            const lowColor = getTempColor(heaterTemp > 30 ? 30 : heaterTemp); 
            const highColor = getTempColor(steamTemp > 30 ? 30 : steamTemp);
            return { low: lowColor, high: highColor };
        }

        function formatTemp(value) {
            return value.toFixed(1);
        }

        function getFlowWheelClass(flow) {
            if (flow < 150) return 'flow-wheel-slow';
            if (flow < 250) return 'flow-wheel-medium';
            return 'flow-wheel-fast';
        }

        function getFlowPipeClass(flow) {
            if (flow < 150) return 'flow-slow';
            if (flow < 250) return 'flow-medium';
            return 'flow-fast';
        }

        function updateSensors() {
            updateSimulationLogic();

            for (let sensor in sensorData) {
                const data = sensorData[sensor];
                
                // Ensure bounds
                data.value = Math.max(data.min, Math.min(data.max, data.value));
                
                const numElement = document.getElementById(`value${sensor}Num`);
                const svgFlowElement = document.getElementById(`svgValue${sensor}`);
                
                if (numElement) {
                    if (!sensor.includes('Flow')) {
                        numElement.textContent = formatTemp(data.value) + '°';
                    }
                }

                if (svgFlowElement) {
                    svgFlowElement.textContent = data.value.toFixed(0);
                }
                
                const cardElement = document.getElementById(`cardValue${sensor}`);
                if (cardElement) {
                    if (sensor.includes('Flow')) {
                        cardElement.textContent = data.value.toFixed(0);
                    } else {
                        cardElement.textContent = formatTemp(data.value);
                    }
                }

                // Handle Flow Sensors (Wheel vs Warning)
                if (sensor.includes('Flow')) {
                    const isNoFlow = data.value < 10;
                    const wheelGroup = document.getElementById(sensor === 'DFFlow' ? 'wheelDFGroup' : 'wheelCoolGroup');
                    const warningIcon = document.getElementById(sensor === 'DFFlow' ? 'warningDF' : 'warningCool');
                    
                    if (wheelGroup && warningIcon) {
                        if (isNoFlow) {
                            wheelGroup.style.display = 'none';
                            warningIcon.style.display = 'block';
                            
                            const pipeId = sensor === 'DFFlow' ? 'dfWaterInPipe' : 'coolWaterInPipe';
                            const pipe = document.getElementById(pipeId);
                            if(pipe) {
                                pipe.classList.remove('flow-slow', 'flow-medium', 'flow-fast');
                                pipe.style.strokeDasharray = 'none';
                            }
                        } else {
                            wheelGroup.style.display = 'block';
                            warningIcon.style.display = 'none';
                            
                            const pipeId = sensor === 'DFFlow' ? 'dfWaterInPipe' : 'coolWaterInPipe';
                            const pipe = document.getElementById(pipeId);
                            if (pipe) {
                                pipe.classList.remove('flow-slow', 'flow-medium', 'flow-fast');
                                pipe.classList.add(getFlowPipeClass(data.value));
                                pipe.style.strokeDasharray = '';
                            }

                            if (wheelGroup) {
                                wheelGroup.classList.remove('flow-wheel-slow', 'flow-wheel-medium', 'flow-wheel-fast');
                                wheelGroup.classList.add(getFlowWheelClass(data.value));
                            }
                        }
                    }
                }

                // Update output pipe colors and animations
                if (sensor === 'DFT') {
                    const outPipe = document.getElementById('dfWaterOutPipe');
                    if (outPipe) {
                        outPipe.style.stroke = getTempColor(data.value);
                        if (sensorData.DFFlow.value >= 10) {
                            outPipe.classList.remove('flow-slow', 'flow-medium', 'flow-fast');
                            outPipe.classList.add(getFlowPipeClass(sensorData.DFFlow.value));
                        } else {
                            outPipe.classList.remove('flow-slow', 'flow-medium', 'flow-fast');
                            outPipe.style.strokeDasharray = 'none';
                        }
                    }
                }
                
                if (sensor === 'CoolT') {
                    const outPipe = document.getElementById('coolWaterOutPipe');
                    if (outPipe) {
                        outPipe.style.stroke = getTempColor(data.value);
                        if (sensorData.CoolFlow.value >= 10) {
                            outPipe.classList.remove('flow-slow', 'flow-medium', 'flow-fast');
                            outPipe.classList.add(getFlowPipeClass(sensorData.CoolFlow.value));
                        } else {
                            outPipe.classList.remove('flow-slow', 'flow-medium', 'flow-fast');
                            outPipe.style.strokeDasharray = 'none';
                        }
                    }
                }
            }

            const colColors = getColumnColors(sensorData.Heater.value, sensorData.Steam.value);
            document.getElementById('colStopLow').setAttribute('stop-color', colColors.low);
            document.getElementById('colStopHigh').setAttribute('stop-color', colColors.high);

            const steamColor = getTempColor(sensorData.Steam.value > 30 ? 30 : sensorData.Steam.value); 
            const coolColor = getTempColor(sensorData.CoolT.value);
            
            document.getElementById('vapStopLow').setAttribute('stop-color', steamColor);
            document.getElementById('vapStopHigh').setAttribute('stop-color', coolColor);
            
            const now = new Date();
            document.getElementById('lastUpdate').textContent = now.toLocaleTimeString('ru-RU');
        }

        updateSensors();
        setInterval(updateSensors, 100); // Faster update for smooth simulation
    </script>
</body>
</html>
